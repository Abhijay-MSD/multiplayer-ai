# One pull request a month per folder, at most two open at a time. Nothing is merged automatically. This file has not been used yet.
#
# - Major versions are never offered: a new major is a decision, not an update. That includes the GitHub Actions in the workflow.
# - @google/generative-ai is 0.x, where a minor version can break things the way a major does, so its minor versions are not offered either.
# - react and react-dom are one pull request in web, because they have to move together.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@google/generative-ai"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      react:
        patterns: ["react", "react-dom"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/web/qa"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/server/supabase-lib"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
