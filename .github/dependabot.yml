# Weekly update pull requests. Nothing is merged automatically. This file has not been used yet.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/web/qa"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/server/supabase-lib"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
