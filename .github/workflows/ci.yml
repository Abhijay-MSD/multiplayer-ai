# This workflow runs on every push to main and every pull request. It has passed on GitHub: all four jobs (the checks on Node 22.13.0
# and Node 24, and the browser tests on Linux and macOS) passed. What it covers: the copy check, the secrets scan (the whole history,
# and the built app), the installs, the build, the server tests and the audit at high severity, on Linux; and the browser tests in
# Chromium, on Linux and macOS. What it does not: Windows, Firefox, Safari, the Docker test, the live Supabase tests, and the QR decoding
# tests, which need macOS and are skipped in the checks job, which runs on Linux.
# The action versions below are tags, not commit SHAs. actions/upload-artifact runs only when a browser test fails, so a passing run
# does not exercise it.
#
# Two jobs, and neither waits for the other: the checks (copy check, secrets scan, installs, build, server tests, audit) and the browser tests.
# A browser test that fails, or flakes, cannot hide a check, and the other way round.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks, Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secrets scan reads the whole history

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The two checks that need no install come first, so a banned phrase or a key is reported without waiting for npm.
      - name: Copy check
        if: matrix.node == '24'
        run: npm run check:copy

      - name: Secrets scan
        if: matrix.node == '24'
        run: node scripts/scan-secrets.mjs # the history, the tracked files, and web/dist if it is there (it is not yet: see the rescan below)

      # The server tests start the real launcher, which needs web/node_modules, and they fail when it is missing. So the packages
      # are installed and the web app is built before them, on both Nodes.
      - name: Install the server
        run: npm ci --prefix server

      - name: Install the web app
        run: npm ci --prefix web

      - name: Build the web app
        run: npm run build

      - name: Server tests
        run: npm test

      - name: Secrets scan of the built app
        if: matrix.node == '24'
        run: node scripts/scan-secrets.mjs # web/dist exists now, so this is the scan that reads it

      - name: Audit (high and above)
        if: matrix.node == '24'
        run: |
          npm audit --audit-level=high --prefix server
          npm audit --audit-level=high --prefix web

  browser:
    name: Browser tests, ${{ matrix.os }}, Node 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: |
          npm ci --prefix web
          npm ci --prefix web/qa

      - name: Install the browser (Linux)
        if: runner.os == 'Linux'
        working-directory: web/qa
        run: npx playwright install --with-deps chromium

      - name: Install the browser (macOS)
        if: runner.os == 'macOS'
        working-directory: web/qa
        run: npx playwright install chromium

      - name: Browser tests
        working-directory: web/qa
        run: npm test

      - name: Keep the test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-output-${{ matrix.os }}
          path: web/qa/.results
          retention-days: 7
          if-no-files-found: ignore
