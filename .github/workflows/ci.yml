# NOT PASSED YET. This workflow has run on GitHub once: install, build and the server tests passed, and the browser tests failed, so the steps
# after them never ran. The browser tests, the checks and the dependency file were changed after that run and have not run on GitHub since.
# The action versions below are tags, not commit SHAs, and were not checked against GitHub (actions/upload-artifact has not run at all).
# When it has passed once, delete this note.
#
# Two jobs, and neither waits for the other: the cheap checks (server tests, copy check, build, secrets scan, audit) and the browser tests.
# A browser test that fails, or flakes, cannot hide a check, and the other way round.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks, Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secrets scan reads the whole history

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install the server
        run: npm ci --prefix server

      - name: Server tests
        run: npm test

      # Everything below runs on Node 24 only. The older Node runs the server tests and nothing else.
      - name: Copy check
        if: matrix.node == '24'
        run: npm run check:copy

      - name: Install the web app
        if: matrix.node == '24'
        run: npm ci --prefix web

      - name: Build the web app
        if: matrix.node == '24'
        run: npm run build

      - name: Secrets scan
        if: matrix.node == '24'
        run: node scripts/scan-secrets.mjs # reads web/dist too, so it comes after the build

      - name: Audit (high and above)
        if: matrix.node == '24'
        run: |
          npm audit --audit-level=high --prefix server
          npm audit --audit-level=high --prefix web

  browser:
    name: Browser tests, ${{ matrix.os }}, Node 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: |
          npm ci --prefix web
          npm ci --prefix web/qa

      - name: Install the browser (Linux)
        if: runner.os == 'Linux'
        working-directory: web/qa
        run: npx playwright install --with-deps chromium

      - name: Install the browser (macOS)
        if: runner.os == 'macOS'
        working-directory: web/qa
        run: npx playwright install chromium

      - name: Browser tests
        working-directory: web/qa
        run: npm test

      - name: Keep the test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-output-${{ matrix.os }}
          path: web/qa/.results
          retention-days: 7
          if-no-files-found: ignore
